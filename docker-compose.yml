services:

  #contenedor 1
  frontend:
    #Construye la imagen usando los archivos en esta carpeta ( . es la carpeta actual)
    build:
      context: .
      #Estas dos las inserta Vite al compilar, no las lee nginx despues: cambiarlas es
      #reconstruir la imagen. Ver .env.example y src/config.js
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_FRONTEND_DOMAIN: ${VITE_FRONTEND_DOMAIN}
    container_name: frontend #el contenedor se llama asi
    restart: unless-stopped #Si el contenedor se cae o docker se reincia, vuelve a levantarlo automaticamente
    #Publicado solo en loopback: cloudflared corre en el host y entra por aqui (ver config.yml)
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - frontend_network
      #Conecta el contenedor frontend a la red llamada frontend_network.

#definir la red que utilizaremos
networks:
  frontend_network:
    driver: bridge 
    #red privada de docker q permite q los contenedores se comuniquen entre ellos